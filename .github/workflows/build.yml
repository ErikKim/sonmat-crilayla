# crilayla.dll: every push builds it (artifact); a tag v* also puts the zip on a release, which is where the app fetches
# it from (sonmat-games/parts.json: the zip's address + SHA-256, then sonmat tools/partfetch.py).
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          cmd /c "build.bat crilayla"; if ($LASTEXITCODE -ne 0 -or -not (Test-Path crilayla.dll)) { throw "crilayla.dll did not build" }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item crilayla.dll, LICENSE pack/
          $v = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}".Substring(1) } else { "dev" }
          Compress-Archive -Path pack/* -DestinationPath "sonmat-crilayla-$v.zip" -Force
          "zip: sonmat-crilayla-$v.zip sha256 $((Get-FileHash "sonmat-crilayla-$v.zip" -Algorithm SHA256).Hash.ToLower())"
      - uses: actions/upload-artifact@v4
        with:
          name: sonmat-crilayla
          path: sonmat-crilayla-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $z = Get-Item sonmat-crilayla-*.zip
          $hash = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower()
          gh release create "${{ github.ref_name }}" $z.FullName --title "sonmat-crilayla ${{ github.ref_name }}" --notes "SHA-256 $hash (the value for sonmat-games/parts.json)"
